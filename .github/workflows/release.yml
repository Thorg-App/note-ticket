name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Extract section between this version header and the next
          CONTENT=$(awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "["ver"]")) found=1; next }
            found { print }
          ' CHANGELOG.md)
          # Handle multiline output
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # The GitHub release is all this workflow does. npm is the only registry this
      # package is published to, and that stays a local, manual step -- see
      # docs-internal/how-to-publish-to-npm.md.
      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.body }}
