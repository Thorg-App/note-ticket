name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suites run thousands of subprocesses with no per-call timeout -- fail in minutes,
    # not on the 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The packaged install path, end to end, on a checkout that has NO dist/ and NO
      # node_modules/: `tk` is a symlink into the checkout, and the wrapper must resolve
      # through it, build the bundle on demand, and still leave stdout carrying nothing but
      # the CLI's own output. MUST stay BEFORE `make test`, which builds dist/ itself and
      # would leave nothing cold to test.
      - name: Smoke-test the build-on-demand install path
        run: |
          set -euo pipefail
          test ! -e dist/ticket.mjs
          test ! -e node_modules
          mkdir -p "$HOME/bin"
          ln -s "$PWD/ticket" "$HOME/bin/tk"
          export PATH="$HOME/bin:$PATH"
          tk help > help.out
          test -f dist/ticket.mjs
          # Line 1 proves all three at once: stdout is uncontaminated by build chatter, the
          # symlink resolved to this checkout, and $0 reached the CLI as the program name.
          head -1 help.out | grep -qx 'tk - minimal ticket system with dependency tracking'
          rm -f help.out

      # `make test` = build + unit tests + the BDD suite, which drives ./ticket itself.
      - name: Run tests
        run: make test

      - name: Typecheck
        run: make typecheck
