name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `make test` builds dist/ticket.mjs first (bash `ticket` delegates TS_COMMANDS to it)
      - name: Run tests
        run: make test
